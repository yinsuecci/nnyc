services:
  signal:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${NN_SIGNAL_LISTEN_IP:-127.0.0.1}:8443:8443"
    volumes:
      - "${NN_SIGNAL_RUNTIME:?set NN_SIGNAL_RUNTIME to the absolute path to the TLS and registry directory}:/run/nn-remote:ro"
      - cluster-data:/var/lib/nn-remote
    environment:
      NN_HEALTH_URL: "https://${NN_SIGNAL_CERT_NAME:?set NN_SIGNAL_CERT_NAME to a DNS name on the server certificate}:8443/healthz"
      NN_HEALTH_CA: "${NN_SIGNAL_HEALTH_CA:-}"
      NN_ADMIN_TOKEN: "${NN_ADMIN_TOKEN:-}"
    extra_hosts:
      - "${NN_SIGNAL_CERT_NAME}:127.0.0.1"
    healthcheck:
      test: ["CMD", "python", "-B", "health_probe.py"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 5s

volumes:
  cluster-data:
