name: Mobile client checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-check.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: mobile
jobs:
  mobile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - if: runner.os == 'Linux'
        run: flutter build apk --debug --no-pub
      - if: runner.os == 'macOS'
        run: flutter build ios --simulator --debug --no-pub
      - if: runner.os == 'macOS'
        run: python3 tool/check_ios_simulator.py
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app build/ios/NNRemote-iPhone-simulator.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: nn-remote-iphone-simulator
          path: |
            mobile/build/ios/NNRemote-iPhone-simulator.zip
            mobile/build/ios/iphone-launch.png
          if-no-files-found: error
